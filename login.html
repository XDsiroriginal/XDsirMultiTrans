<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/login.css">
    <title>Вход в аккаунт — MultiTrans</title>
</head>
<body>

<div class="auth_wrapper">
    <header class="auth_header">
        <a href="index.html" class="main_button">
            <img src="src/img/logo.png" alt="MultiTrans Logo">
            <p class="logo_name">MultiTrans</p>
        </a>
        <a href="index.html" class="back_link">← На главную</a>
    </header>

    <main class="auth_main">
        <div class="auth_card">
            <div class="auth_title_box">
                <h1 class="auth_title">Вход в кабинет</h1>
                <p class="auth_subtitle">Управляйте вашими посылками и заказами</p>
            </div>

            <form class="auth_form" action="profile.html">
                <div class="form_group">
                    <label class="form_label" for="login-email">Электронная почта</label>
                    <input type="email" id="login-email" class="input_field" placeholder="name@example.com" required>
                </div>

                <div class="form_group">
                    <div style="display: flex; justify-content: space-between; align-items: center;">
                        <label class="form_label" for="login-password">Пароль</label>
                        <a href="#" style="font-size: 12px; color: var(--color-text-secondary);">Забыли пароль?</a>
                    </div>
                    <input type="password" id="login-password" class="input_field" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary" style="width: 100%; height: 52px; font-size: 16px;">Войти</button>
            </form>

            <div class="divider_row">
                <span class="divider_line"></span>
                <span class="divider_text">или через соцсети</span>
                <span class="divider_line"></span>
            </div>

            <div class="social_auth_row">
                <button type="button" class="social_btn">
                    <img src="src/img/vk-log-logo 1.png" alt="VK">
                    ВКонтакте
                </button>
                <button type="button" class="social_btn">
                    <img src="src/img/max-messenger-horizontal-logo 1.png" alt="MAX">
                    MAX ID
                </button>
            </div>

            <div class="auth_switch">
                Еще нет аккаунта? <a href="registration.html">Зарегистрироваться</a>
            </div>
        </div>
    </main>
</div>

</body>
</html>
