<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="src/css/main.css">
    <link rel="stylesheet" href="src/css/login.css">
    <title>Регистрация — MultiTrans</title>
</head>
<body>

<div class="auth_wrapper">
    <header class="auth_header">
        <a href="index.html" class="main_button">
            <img src="src/img/logo.png" alt="MultiTrans Logo">
            <p class="logo_name">MultiTrans</p>
        </a>
        <a href="index.html" class="back_link">← На главную</a>
    </header>

    <main class="auth_main">
        <div class="auth_card" style="max-width: 520px;">
            <div class="auth_title_box">
                <h1 class="auth_title">Создание аккаунта</h1>
                <p class="auth_subtitle">Получите адреса в США, Китае и Индии бесплатно</p>
            </div>

            <form class="auth_form" action="profile.html">
                <div class="form_group">
                    <label class="form_label" for="reg-name">Имя и Фамилия</label>
                    <input type="text" id="reg-name" class="input_field" placeholder="Иван Иванов" required>
                </div>

                <div class="form_group">
                    <label class="form_label" for="reg-email">Электронная почта</label>
                    <input type="email" id="reg-email" class="input_field" placeholder="name@example.com" required>
                </div>

                <div class="form_group">
                    <label class="form_label" for="reg-phone">Номер телефона</label>
                    <input type="tel" id="reg-phone" class="input_field" placeholder="+7 (999) 000-00-00" required>
                </div>

                <div class="form_group">
                    <label class="form_label" for="reg-password">Придумайте пароль</label>
                    <input type="password" id="reg-password" class="input_field" placeholder="Минимум 8 символов" required>
                </div>

                <label class="checkbox_label">
                    <input type="checkbox" required checked>
                    <span>Я согласен с <a href="faq.html" style="color: var(--color-accent);">правилами сервиса</a> и обработкой персональных данных</span>
                </label>

                <button type="submit" class="btn-primary" style="width: 100%; height: 52px; font-size: 16px;">Зарегистрироваться</button>
            </form>

            <div class="divider_row">
                <span class="divider_line"></span>
                <span class="divider_text">или быстрая регистрация</span>
                <span class="divider_line"></span>
            </div>

            <div class="social_auth_row">
                <button type="button" class="social_btn">
                    <img src="src/img/vk-log-logo 1.png" alt="VK">
                    ВКонтакте
                </button>
                <button type="button" class="social_btn">
                    <img src="src/img/telegram-svgrepo-com 1.png" alt="TG">
                    Telegram
                </button>
            </div>

            <div class="auth_switch">
                Уже есть личный кабинет? <a href="login.html">Войти</a>
            </div>
        </div>
    </main>
</div>

</body>
</html>
